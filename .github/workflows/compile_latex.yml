name: Compile Thesis & Documentation

on:
  push:
    paths:
      - 'thesis/**'
      - '.github/workflows/compile_latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Build PDFs and Publish to Documentation Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Tectonic packages and fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('thesis/**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - name: Install system fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            fonts-dejavu-core \
            fonts-freefont-ttf \
            poppler-utils \
            curl

      - name: Setup Tectonic LaTeX engine
        uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Tectonic Version
        run: tectonic --version

      - name: Compile Model Architecture Diagram
        run: |
          echo "=== Compiling Model Architecture Diagram ==="
          tectonic -X compile thesis/figures/model_architecture_heads_style.tex --outdir thesis/figures

      - name: Compile Vietnamese Thesis
        run: |
          echo "=== Compiling Vietnamese Thesis ==="
          tectonic -X compile thesis/vi/main.tex --outdir thesis/vi

      - name: Compile English Thesis
        run: |
          echo "=== Compiling English Thesis ==="
          tectonic -X compile thesis/en/main.tex --outdir thesis/en

      - name: Compile Weekly Presentation Slides
        run: |
          echo "=== Compiling Weekly Presentation Slides ==="
          tectonic -X compile thesis/presentation/weekly_update_slides.tex --outdir thesis/presentation

      - name: Prepare Documentation Distribution
        run: |
          mkdir -p dist
          cp thesis/vi/main.pdf dist/Vietnamese_Thesis_LayoutLMv3.pdf
          cp thesis/en/main.pdf dist/English_Thesis_LayoutLMv3.pdf
          cp thesis/presentation/weekly_update_slides.pdf dist/Weekly_Progress_Presentation_Slides.pdf
          cp thesis/figures/model_architecture_heads_style.pdf dist/Model_Architecture_Diagram.pdf
          cp thesis/presentation/weekly_update_script.md dist/Weekly_Progress_Presentation_Script.md
          cp thesis/presentation/weekly_update_script_vi.md dist/Weekly_Progress_Presentation_Script_VI.md

          cat << 'EOF' > dist/README.md
          # Project Documentation & Compiled Documents

          All documents in this branch are compiled automatically from the latest commit on `main`.
          Click any link below to open and preview the document natively in GitHub's PDF viewer:

          ### 📄 Thesis Manuscripts
          - **[Vietnamese Thesis (PDF)](Vietnamese_Thesis_LayoutLMv3.pdf)** — *Nghiên cứu cải tiến mô hình thị giác - ngôn ngữ cho bài toán trích xuất thông tin khóa trên tài liệu*
          - **[English Thesis (PDF)](English_Thesis_LayoutLMv3.pdf)** — *Research on Enhancing Vision-Language Model for Document Key Information Extraction*

          ### 📊 Presentation & Model Diagram
          - **[Weekly Progress Presentation Slides (PDF)](Weekly_Progress_Presentation_Slides.pdf)** (20 Slides)
          - **[Model Architecture Diagram (PDF)](Model_Architecture_Diagram.pdf)** (Full End-to-End Diagram)

          ### 📝 Speaker Scripts
          - **[Presentation Script - Vietnamese (Markdown)](Weekly_Progress_Presentation_Script_VI.md)**
          - **[Presentation Script - English (Markdown)](Weekly_Progress_Presentation_Script.md)**
          EOF

          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-thesis-pdfs
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Deploy to documentation Branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b documentation
          git add -A
          git commit -m "Deploy compiled documentation [${{ github.sha }}]"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git documentation
